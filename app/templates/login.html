{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="form-card">
  <h1>Login</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Phone number
      <input name="phone" placeholder="03XXXXXXXXX" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" required>
    </label>
    <button class="btn btn-block" type="submit">Login</button>
  </form>
  <p class="hint">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
