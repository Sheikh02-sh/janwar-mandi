{% extends "base.html" %}
{% block title %}Post an Ad{% endblock %}
{% block content %}
<div class="form-card wide">
  <h1>Post your livestock ad</h1>
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="row">
      <label>Animal type *
        <select name="category_id" required>
          <option value="">Choose...</option>
          {% for c in categories %}
            <option value="{{ c.id }}" {{ 'selected' if form.get('category_id') == c.id|string }}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Breed
        <input name="breed" placeholder="e.g. Beetal, Nagra, Sahiwal" value="{{ form.get('breed', '') }}">
      </label>
    </div>

    <label>Title *
      <input name="title" required maxlength="150" placeholder="e.g. Healthy Beetal Bakra for Qurbani" value="{{ form.get('title', '') }}">
    </label>

    <div class="row">
      <label>Gender
        <select name="gender">
          <option value="">-</option>
          <option value="male" {{ 'selected' if form.get('gender') == 'male' }}>Male</option>
          <option value="female" {{ 'selected' if form.get('gender') == 'female' }}>Female</option>
        </select>
      </label>
      <label>Age (months)
        <input name="age_months" type="number" min="0" value="{{ form.get('age_months', '') }}">
      </label>
      <label>Weight (kg)
        <input name="weight_kg" type="number" step="0.1" min="0" value="{{ form.get('weight_kg', '') }}">
      </label>
    </div>

    <div class="row">
      <label>Price (PKR) *
        <input name="price" type="number" min="1" required value="{{ form.get('price', '') }}">
      </label>
      <label class="check"><input type="checkbox" name="is_negotiable" value="1" {{ 'checked' if form.get('is_negotiable', '1') }}> Price is negotiable</label>
    </div>

    <div class="row">
      <label>City *
        <input name="city" required value="{{ form.get('city', '') }}">
      </label>
      <label>Area / Mandi
        <input name="area" value="{{ form.get('area', '') }}">
      </label>
      <label>Contact number *
        <input name="contact_phone" required placeholder="03XXXXXXXXX" value="{{ form.get('contact_phone', '') }}">
      </label>
    </div>

    <label>Description
      <textarea name="description" rows="5" placeholder="Health, feed, vaccination, teeth, any other details...">{{ form.get('description', '') }}</textarea>
    </label>

    <label>Photos * (1 to 5, JPG/PNG/WEBP)
      <input id="images" name="images" type="file" accept="image/*" multiple required>
    </label>
    <div id="preview" class="preview"></div>

    <button class="btn btn-block" type="submit">Submit ad</button>
    <p class="hint">Your ad goes live after admin approval.</p>
  </form>
</div>
{% endblock %}
