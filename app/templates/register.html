{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="form-card">
  <h1>Create account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Full name
      <input name="name" required value="{{ form.get('name', '') }}">
    </label>
    <label>Mobile number
      <input name="phone" placeholder="03XXXXXXXXX" required value="{{ form.get('phone', '') }}">
    </label>
    <label>City
      <input name="city" value="{{ form.get('city', '') }}">
    </label>
    <label>Password
      <input name="password" type="password" minlength="6" required>
    </label>
    <label>Confirm password
      <input name="confirm" type="password" minlength="6" required>
    </label>
    <button class="btn btn-block" type="submit">Sign up</button>
  </form>
  <p class="hint">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
</div>
{% endblock %}
